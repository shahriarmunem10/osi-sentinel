{% extends "base.html" %}
{% block ptitle %}Reports{% endblock %}
{% block body %}
<h1>Security reports</h1>
<p class="sub">Each report is a single interactive HTML file with charts, filters and CSV export. It works offline and can be sent to anyone.</p>
<div class="card" style="margin-bottom:14px">
  <div class="row">
    <div><label for="rRange">Time range</label><select id="rRange"><option value="all">All recorded data</option><option value="24h">Last 24 hours</option><option value="1h">Last 1 hour</option></select></div>
    <button class="btn" id="rGen">Generate report</button>
  </div>
  <div id="rMsg"></div>
</div>
<div class="card"><h2>Generated reports</h2>
  <table><thead><tr><th>File</th><th>Created</th><th>Size</th><th></th></tr></thead><tbody id="rList"></tbody></table>
</div>
{% endblock %}
