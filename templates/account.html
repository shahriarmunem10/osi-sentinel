{% extends "base.html" %}
{% block ptitle %}Account{% endblock %}
{% block body %}
<h1>Change password</h1>
<p class="sub">Choose a password with at least 8 characters.</p>
<div class="card" style="max-width:420px">
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label for="o">Current password</label>
    <input id="o" name="old" type="password" required>
    <label for="n">New password</label>
    <input id="n" name="new" type="password" required minlength="8">
    {% if msg %}<div class="result {{ 'ok' if ok else 'bad' }}">{{ msg }}</div>{% endif %}
    <p><button class="btn" type="submit">Update password</button></p>
  </form>
</div>
{% endblock %}
